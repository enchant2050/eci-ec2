name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "${EC2_PORT:-22}" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/eci-ocr}"
          SSH="ssh -i ~/.ssh/ec2_key -p ${EC2_PORT:-22}"
          $SSH "$EC2_USER@$EC2_HOST" "sudo mkdir -p '$APP_DIR' && sudo chown -R '$EC2_USER':'$EC2_USER' '$APP_DIR'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'venv' \
            --exclude '.runtime' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'inputs' \
            --exclude 'outputs' \
            --exclude 'logs' \
            -e "$SSH" ./ "$EC2_USER@$EC2_HOST:$APP_DIR/"

      - name: Install dependencies on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail
          APP_DIR="${APP_DIR:-/opt/eci-ocr}"
          ssh -i ~/.ssh/ec2_key -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" \
            "cd '$APP_DIR' && chmod +x scripts/*.sh && APP_DIR='$APP_DIR' scripts/bootstrap_ec2.sh"
